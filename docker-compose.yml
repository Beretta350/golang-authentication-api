version: '3.7'

services:
    app:
        container_name: authentication
        build:
            context: .
        environment:
            - SERVER_PORT=8080
            - SERVER_MODE=debug
            - DB_DRIVER=mongodb
            - DB_HOST=mongodb
            - DB_PORT=27017
            - DB_USERNAME=root
            - DB_PASSWORD=root
            - DB_DATABASE=authentication
            - JWT_SECRET=Hxj1pW48QqcnSQAc5
        depends_on:
            - mongodb
        ports:
            - 8080:8080

    dynamodb:
        container_name: dynamodb
        command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
        image: "amazon/dynamodb-local:latest"
        working_dir: /home/dynamodblocal
        ports:
            - "8000:8000"
        volumes:
            - ./dynamodb-data:/home/dynamodblocal/data
    
    dynamodb-init:
        image: amazon/aws-cli
        depends_on:
            - dynamodb
        volumes:
            - ./scripts/database/dynamo-init.sh:/scripts
        entrypoint: ["sh", "/scripts/dynamo-init.sh"]

    mongodb:
        image: mongo:latest
        container_name: mongodb
        restart: always
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: root
            MONGO_INITDB_DATABASE: authentication
        ports:
            - 27017:27017
        volumes:
            - ./scripts/database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro